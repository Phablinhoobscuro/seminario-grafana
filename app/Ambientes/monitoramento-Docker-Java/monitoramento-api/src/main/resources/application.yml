spring:
  application:
    name: monitoramento-api
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
info:
  app:
    name: Monitoramento API
    description: API de exemplo com Spring Boot, Prometheus e Grafana
    version: 1.0.0
